name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" --group dev
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q

  minimal-install:
    # The core package must import without any optional extra installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -c "import htmlexport; print(htmlexport.Converter().parse('<p>ok</p>'))"

  oldest-dependencies:
    # Keeps the minimum versions in pyproject.toml honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install oldest supported versions
        run: |
          python -m pip install --upgrade pip
          pip install . "python-docx==1.1.0" "XlsxWriter==3.2.0" "tinycss2==1.4.0" "weasyprint==63.0" \
            "beautifulsoup4==4.12.0" "soupsieve==2.5" pytest openpyxl pypdf
      - run: pytest -q
