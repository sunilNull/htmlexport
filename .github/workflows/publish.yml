name: Publish to PyPI

# Runs when you publish a GitHub Release. Uses PyPI Trusted Publishing,
# so no API token is stored in GitHub. One-time setup on pypi.org:
#   Account settings -> Publishing -> Add a pending publisher
#   (project: htmlexport, workflow: publish.yml, environment: pypi)
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
